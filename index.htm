<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Jan Tracker</title>

<style>

html{
    background:#080b12;
    color-scheme:dark;
}

html,
body{
    background-color:#080b12;
}

:root{
    --bg:#090a0d;
    --card:#15171c;
    --card2:#1b1e24;
    --text:#f5f5f7;
    --muted:#9a9ca4;
    --accent:#8ab4ff;
    --green:#4ade80;
    --line:#292c33;
    --danger:#ff6b6b;

    --calendar-empty:#15171c;
    --calendar-done:#203d2d;
    --calendar-partial:#202f45;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:linear-gradient(
        180deg,
        #080b12 0%,
        #0d121b 100%
    );
    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Arial,
        sans-serif;
    min-height:100vh;
    min-height:100svh;
    padding-bottom:env(safe-area-inset-bottom);
}

button,
input,
textarea{
    font:inherit;
}

button{
    border:0;
    color:var(--text);
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}

button:active,
.btn:active,
.check:active{
    transform:translateY(-3px) scale(1.025);
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
.check:has(input:focus-visible){
    outline:2px solid #78b8ff;
    outline-offset:3px;
}

.app{
    max-width:720px;
    margin:auto;
    padding:20px 16px 110px;
}

header{
    padding:15px 2px;
    display:flex;
    justify-content:space-between;
    align-items:end;
}

h1{
    font-size:30px;
    letter-spacing:-1px;
    margin:0;
    font-weight:750;
}

.subtitle{
    color:var(--muted);
    font-size:14px;
    margin-top:5px;
}

.date-pill{
    background:#1b1d22;
    border:1px solid var(--line);
    padding:9px 12px;
    border-radius:14px;
    color:#cfd1d8;
    font-size:12px;
}

.tabs{
    display:flex;
    background:#121419;
    border:1px solid var(--line);
    border-radius:16px;
    padding:4px;
    margin:8px 0 18px;
    position:sticky;
    top:8px;
    z-index:5;
}

.tabs button{
    flex:1;
    background:transparent;
    padding:10px 6px;
    border-radius:12px;
    color:var(--muted);
    font-size:13px;
    cursor:pointer;
}

.tabs button.active{
    background:#202c40;
    color:white;
    box-shadow:0 0 14px rgba(74,157,255,.12);
}

.tabs button:active,
.calendar-nav button:active{
    transform:translateY(-3px) scale(1.06);
}

.view{
    display:none;
}

.view.active{
    display:block;
}

.section{
    margin:18px 0;
}

.section-title{
    font-size:18px;
    font-weight:700;
    margin:0 0 9px;
}

.section-note{
    font-size:12px;
    color:var(--muted);
    margin:-3px 0 10px;
}

.card{
    background:rgba(21,23,28,.94);
    border:1px solid var(--line);
    border-radius:20px;
    padding:16px;
    margin:10px 0;
    box-shadow:0 10px 30px rgba(0,0,0,.14);
}

/* Resalte azul sutil para tarjetas y paneles destacados */
.neon-card{
    border-color:rgba(74,157,255,.42);
    box-shadow:
        0 10px 30px rgba(0,0,0,.16),
        0 0 0 1px rgba(74,157,255,.06),
        0 0 18px rgba(42,139,255,.10);
}

.neon-card:hover{
    border-color:rgba(92,174,255,.62);
    box-shadow:
        0 12px 32px rgba(0,0,0,.18),
        0 0 0 1px rgba(74,157,255,.10),
        0 0 22px rgba(42,139,255,.16);
}

.meal-head{
    display:flex;
    justify-content:space-between;
    gap:12px;
    align-items:center;
}

.meal-name{
    font-size:16px;
    font-weight:700;
}

.time{
    font-size:12px;
    color:var(--muted);
}

.plan{
    font-size:14px;
    line-height:1.5;
    color:#d8dae0;
    margin:10px 0 13px;
}

.plan strong{
    color:#fff;
}

.checkrow{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.check{
    display:flex;
    align-items:center;
    gap:8px;
    background:#1b1e24;
    border:1px solid #30343c;
    padding:9px 11px;
    border-radius:13px;
    color:#cfd1d8;
    font-size:13px;
    cursor:pointer;
}

.check input{
    width:18px;
    height:18px;
    accent-color:var(--green);
}

.small-input{
    width:100%;
    background:#101216;
    color:white;
    border:1px solid #30343c;
    border-radius:12px;
    padding:11px;
    margin-top:9px;
    outline:none;
}

.small-input:focus,
.field input:focus,
textarea:focus{
    border-color:#536a91;
    box-shadow:0 0 0 2px rgba(138,180,255,.08);
}

.comment-wrapper{
    margin-top:9px;
}

.comment-counter{
    display:flex;
    justify-content:flex-end;
    color:var(--muted);
    font-size:11px;
    margin-top:5px;
}

.comment-counter.limit{
    color:var(--danger);
}

.training{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.train{
    padding:15px;
    border:1px solid var(--line);
    border-radius:18px;
    background:#15171c;
}

.train label{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:650;
    font-size:14px;
}

.train input{
    width:21px;
    height:21px;
    accent-color:var(--green);
}


/* =========================
   SUEÑO
========================= */

.sleep-card{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.sleep-grid{
    width:100%;
    max-width:480px;

    display:grid;
    grid-template-columns:1fr;
    gap:14px;
}

.field{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:0;
}

.field label{
    display:block;
    width:100%;
    text-align:center;
    color:var(--muted);
    font-size:12px;
    margin-bottom:7px;
}

.field input{
    width:100%;
    max-width:100%;
    min-width:0;
    background:#101216;
    color:white;
    border:1px solid #30343c;
    border-radius:13px;
    padding:12px;
    outline:none;
    text-align:center;
}

.sleep-result{
    width:100%;
    max-width:480px;
    margin-top:18px;
    padding:13px;
    border-radius:14px;
    background:#111318;
    color:#cfd1d8;
    font-size:13px;
    text-align:center;
}

.sleep-result strong{
    color:white;
    margin-left:4px;
}

.sleep-feedback{
    width:100%;
    margin-top:9px;
    padding:9px 11px;
    border-radius:12px;
    font-size:12px;
    line-height:1.4;
    text-align:center;
    color:#cfe4ff;
    background:#142338;
    border:1px solid rgba(93,166,255,.3);
}

.sleep-feedback.warning{
    color:#ffd8a8;
    background:#2a2117;
    border-color:rgba(255,190,105,.35);
}


/* =========================
   BOTÓN GUARDAR
========================= */

.save-section{
    margin-top:30px;
    margin-bottom:30px;
}

.save-day{
    width:100%;
    padding:15px 18px;
    border-radius:16px;
    background:var(--green);
    color:#07100a;
    font-weight:750;
    font-size:15px;
    cursor:pointer;
    transition:
        transform .15s ease,
        opacity .15s ease;
}

.save-day:hover{
    opacity:.92;
}

.save-day:active{
    transform:scale(.98);
}

.save-message{
    text-align:center;
    color:var(--green);
    font-size:12px;
    margin-top:9px;
    min-height:16px;
}


/* =========================
   AVISO
========================= */

.notice{
    background:#111820;
    border:1px solid #273548;
    color:#cddcff;
    padding:12px;
    border-radius:15px;
    font-size:12px;
    line-height:1.45;
}


/* =========================
   HISTORIAL / CALENDARIO
========================= */

.calendar-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
}

.calendar-title{
    font-size:17px;
    font-weight:700;
    text-transform:capitalize;
}

.calendar-nav{
    display:flex;
    gap:7px;
}

.calendar-nav button{
    width:36px;
    height:36px;
    border-radius:11px;
    background:#252830;
    border:1px solid #343842;
    cursor:pointer;
    font-size:17px;
}

.calendar-weekdays,
.calendar-grid{
    display:grid;
    grid-template-columns:
        repeat(7,minmax(0,1fr));
    grid-template-rows:repeat(6,minmax(0,1fr));
    gap:6px;
}

.calendar-weekdays{
    margin-bottom:6px;
}

.calendar-weekdays div{
    text-align:center;
    color:var(--muted);
    font-size:10px;
    font-weight:600;
}

.calendar-day{
    aspect-ratio:1;
    min-width:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:11px;
    border:1px solid #292c33;

    background:var(--calendar-empty);

    color:#bfc2ca;
    font-size:12px;

    cursor:pointer;

    transition:
        transform .12s ease,
        border-color .12s ease;
}

.calendar-card{
    border-color:rgba(74,157,255,.34);
    box-shadow:
        0 10px 30px rgba(0,0,0,.16),
        0 0 18px rgba(42,139,255,.08);
}

.calendar-day:hover{
    transform:scale(1.04);
    border-color:#4a5060;
}

.calendar-day.empty{
    visibility:hidden;
    cursor:default;
}

.calendar-day.today{
    border-color:var(--accent);
    box-shadow:
        0 0 0 1px rgba(138,180,255,.15);
}

.calendar-day.today::after{
    content:"Hoy";
    position:absolute;
    right:4px;
    bottom:3px;
    font-size:8px;
    color:#8ec5ff;
    font-weight:700;
}

.calendar-day{
    position:relative;
}

.calendar-day.partial{
    background:var(--calendar-partial);
    color:#dce8ff;
    border-color:#31476a;
}

.calendar-day.complete{
    background:var(--calendar-done);
    color:#bff3cc;
    border-color:#356344;
}

.calendar-day.selected{
    outline:2px solid var(--accent);
    outline-offset:1px;
}

.calendar-legend{
    display:flex;
    justify-content:center;
    gap:16px;
    margin-top:16px;
    flex-wrap:wrap;
}

.legend-item{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--muted);
    font-size:11px;
}

.legend-dot{
    width:10px;
    height:10px;
    border-radius:3px;
    border:1px solid var(--line);
}

.legend-dot.empty{
    background:var(--calendar-empty);
}

.legend-dot.partial{
    background:var(--calendar-partial);
}

.legend-dot.complete{
    background:var(--calendar-done);
}

.history-selected{
    margin-top:14px;
    padding:12px;
    background:#111318;
    border-radius:14px;
    font-size:12px;
    color:var(--muted);
    text-align:center;
}


/* =========================
   ESTADÍSTICAS
========================= */

.stats-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.stat{
    background:#15171c;
    border:1px solid var(--line);
    border-radius:18px;
    padding:15px;
}

.stat:nth-child(1),
.stat:nth-child(4){
    border-color:rgba(74,157,255,.38);
    box-shadow:0 0 17px rgba(42,139,255,.09);
}

.stat b{
    display:block;
    font-size:25px;
}

.stat span{
    font-size:12px;
    color:var(--muted);
}

.progress{
    height:7px;
    background:#252830;
    border-radius:99px;
    overflow:hidden;
    margin-top:10px;
}

.progress i{
    display:block;
    height:100%;
    background:var(--green);
    border-radius:99px;
}

.chart-card{
    border-color:rgba(74,157,255,.34);
    background:linear-gradient(145deg,#151d2b,#15171c);
}

.chart-title{
    font-size:13px;
    font-weight:700;
    margin-bottom:14px;
}

.bar-chart{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    align-items:end;
    gap:8px;
    min-height:150px;
}

.bar-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:end;
    gap:6px;
    min-width:0;
    height:150px;
}

.bar-value{
    color:#cfe4ff;
    font-size:10px;
}

.bar-track{
    width:100%;
    max-width:28px;
    height:105px;
    display:flex;
    align-items:end;
    background:#202838;
    border-radius:8px;
    overflow:hidden;
}

.bar-fill{
    width:100%;
    min-height:3px;
    background:linear-gradient(180deg,#78b8ff,#3479c8);
    border-radius:8px 8px 0 0;
}

.bar-label{
    color:var(--muted);
    font-size:10px;
}


/* =========================
   BORRADO / GENERAL
========================= */

.btn{
    background:#202a3a;
    border:1px solid #354762;
    padding:10px 13px;
    border-radius:12px;
    cursor:pointer;
}

.btn.primary{
    background:#e9eaf0;
    color:#111;
}

.btn.danger{
    background:#2a1517;
    color:#ff9a9a;
    border-color:#472024;
}

.empty{
    text-align:center;
    color:var(--muted);
    padding:35px 10px;
}

footer{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:#080b12;
    backdrop-filter:blur(18px);
    border-top:1px solid var(--line);
    text-align:center;
    color:#747780;
    font-size:11px;
    z-index:10;
}

#saveStatus{
    color:#8fbfff;
    margin-left:6px;
}

@media(max-width:420px){

    h1{
        font-size:27px;
    }

    .training{
        grid-template-columns:1fr;
    }

    .sleep-grid{
        width:100%;
        grid-template-columns:1fr;
        gap:14px;
    }

    .field input{
        max-width:170px;
    }

    .calendar-grid,
    .calendar-weekdays{
        gap:4px;
    }

    .calendar-day{
        border-radius:8px;
        font-size:11px;
    }

    .app{
        padding-left:11px;
        padding-right:11px;
    }

    .card{
        padding:13px;
        border-radius:17px;
    }

    .meal-head{
        align-items:flex-start;
        flex-wrap:wrap;
    }

    .plan{
        font-size:13px;
        line-height:1.45;
    }

    .tabs button{
        font-size:12px;
        padding-left:3px;
        padding-right:3px;
    }

}

@media(max-width:360px){
    .sleep-grid{
        grid-template-columns:1fr;
        gap:14px;
    }

    .field input{
        max-width:100%;
    }
}

</style>
</head>

<body>

<div class="app">

<header>

<div>

<h1>Jan Tracker</h1>

<div class="subtitle">
Nutrición · entrenamiento · descanso
</div>

</div>

<div class="date-pill" id="datePill"></div>

</header>


<nav class="tabs">

<button class="active" data-tab="today">
Hoy
</button>

<button data-tab="history">
Historial
</button>

<button data-tab="stats">
Estadísticas
</button>

</nav>


<main>

<section id="today" class="view active"></section>

<section id="history" class="view"></section>

<section id="stats" class="view"></section>

</main>

</div>


<footer>
Los cambios se guardan automáticamente en este dispositivo.
<span id="saveStatus" aria-live="polite">Listo</span>
</footer>


<script>

/* =========================
   PLAN NUTRICIONAL
========================= */

const PLAN = {
0:{name:"Domingo", breakfast:"3 huevos revueltos + 2 tostadas de barra de pan con un chorrito de aceite de oliva + 1 pieza de fruta + 1 vaso de leche.", lunch:"Comida familiar libre: lo que se cocine en casa. Asegurar una buena ración de carne, pescado o huevos.", snack:"1 vaso grande de leche entera o semidesnatada con copos de avena o cereales integrales.", dinner:"Empanadillas al horno (rellenas de atún/huevo/jamón) + el propio relleno proteico de las empanadillas.", training:[]},
1:{name:"Lunes", breakfast:"Bocadillo de media barra de pan con 80 g de pechuga de pavo o pollo + 1 plátano maduro + 1 yogur natural.", lunch:"Arroz hervido (1 taza y media en seco, ya cocido) + 3 hamburguesas de ternera o pollo a la plancha.", snack:"1 yogur griego natural + 1 pieza de fruta (pera, mandarina o plátano) + 1 puñado de crackers integrales.", dinner:"Puré de verduras (calabacín, zanahoria, cebolla y patata) + tortilla francesa de 2 huevos enteros.", training:["box","weights"]},
2:{name:"Martes", breakfast:"Tortilla francesa de 3 huevos enteros + bocadillo de media barra de pan con queso tierno o jamón serrano + 1 vaso de leche.", lunch:"3 patatas medianas cocidas o al horno + 180 g de pechuga de pollo a la plancha (2 filetes grandes).", snack:"1 vaso grande de leche entera o semidesnatada con copos de avena o cereales integrales.", dinner:"Caldo de pollo y huesos con fideos finos de pasta + 150 g de pechuga de pollo desmechada dentro de la sopa.", training:["weights"]},
3:{name:"Miércoles", breakfast:"Bocadillo de media barra de pan con 80 g de pechuga de pavo o pollo + 1 plátano maduro + 1 yogur natural.", lunch:"Plato generoso de legumbres (lentejas/garbanzos) con arroz + 1 huevo duro picado + 1 lata de atún al natural.", snack:"1 yogur griego natural + 1 pieza de fruta (pera, mandarina o plátano) + 1 puñado de crackers integrales.", dinner:"Ñoquis al horno con especias (orégano, albahaca) + 120 g de tacos de jamón dulce/pavo + pizca de queso rallado.", training:["box","weights"]},
4:{name:"Jueves", breakfast:"Tortilla francesa de 3 huevos enteros + bocadillo de media barra de pan con queso tierno o jamón serrano + 1 vaso de leche.", lunch:"Pasta (macarrones/espaguetis) con salsa de tomate frito + 200 g de carne picada de pollo o pavo mezclada.", snack:"1 vaso grande de leche entera o semidesnatada con copos de avena o cereales integrales.", dinner:"Sopa de estrellas o fideos finos con caldo limpio de pollo + 1 taza grande de queso fresco batido 0% o requesón.", training:["weights"]},
5:{name:"Viernes", breakfast:"1 yogur griego natural grande con 60 g de cereales de maíz (sin azúcar) + 1 manzana + 1 puñado de frutos secos.", lunch:"Judías verdes hervidas con patatas y un chorrito de aceite + 2 filetes de pescado blanco (merluza, bacalao o lenguado).", snack:"1 yogur griego natural + 1 pieza de fruta (pera, mandarina o plátano) + 1 puñado de crackers integrales.", dinner:"Tu Pizza Semanal: 1 pizza mediana al gusto + proteínas contenidas en la propia pizza.", training:[]},
6:{name:"Sábado", breakfast:"3 huevos revueltos + 2 tostadas de barra de pan con un chorrito de aceite de oliva + 1 pieza de fruta + 1 vaso de leche.", lunch:"Arroz a la cubana con salsa de tomate frito + 2 huevos fritos/plancha + 4 lonchas de lomo embuchado.", snack:"1 vaso grande de leche entera o semidesnatada con copos de avena o cereales integrales.", dinner:"Quinoa hervida y salteada con un poquito de ajo en sartén + 150 g de salmón o pescado azul a la plancha (Omega-3).", training:[]}
};


/* =========================
   GUARDADO
========================= */

const KEY = "janTrackerDataV1";

let data = loadData();

let selectedDate = localDateKey();

let calendarDate = new Date();

let savePending = true;


function localDateKey(d=new Date()){

    const y = d.getFullYear();

    const m = String(d.getMonth()+1).padStart(2,"0");

    const day = String(d.getDate()).padStart(2,"0");

    return `${y}-${m}-${day}`;

}


function parseDate(k){

    const [y,m,d] = k.split("-").map(Number);

    return new Date(y,m-1,d);

}


function loadData(){

    try{

        return JSON.parse(
            localStorage.getItem(KEY)
        ) || {
            days:{},
            lastOpen:localDateKey()
        };

    }catch(e){

        return {
            days:{},
            lastOpen:localDateKey()
        };

    }

}


function save(){

    if(!savePending){
        return;
    }

    localStorage.setItem(
        KEY,
        JSON.stringify(data)
    );

    savePending = false;

    const status = document.getElementById("saveStatus");
    if(status){
        status.textContent = "Guardado automáticamente";
        clearTimeout(window.saveStatusTimer);
        window.saveStatusTimer = setTimeout(()=>{
            status.textContent = "Listo";
        },1800);
    }

}


/* =========================
   CREAR DÍA
========================= */

function blankDay(k){

    const dow = parseDate(k).getDay();

    return {

        date:k,

        breakfast:false,
        breakfastNote:"",

        lunch:false,
        lunchNote:"",

        snack:false,
        snackNote:"",

        dinner:false,
        dinnerNote:"",

        creatine:false,

        box:false,

        weights:false,

        rest:false,

        bed:"",

        wake:"",

        sleepHours:"",

        notes:"",

        dow:dow

    };

}


function getDay(k){

    if(!data.days[k]){

        data.days[k] = blankDay(k);

    }

    data.days[k].date = k;
    data.days[k].dow = parseDate(k).getDay();

    return data.days[k];

}


/* =========================
   CAMBIO DE DÍA
========================= */

function autoRollover(){

    const today = localDateKey();

    if(data.lastOpen !== today){

        data.lastOpen = today;
        savePending = true;

        if(!data.days[today]){

            data.days[today] = blankDay(today);
            savePending = true;

        }

        save();

    }

    else{

        if(!data.days[today]){

            data.days[today] = blankDay(today);
            savePending = true;

        }

        save();

    }

}


/* =========================
   FECHAS
========================= */

function formatDate(k){

    return parseDate(k).toLocaleDateString(
        "es-ES",
        {
            weekday:"long",
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );

}


function shortDate(k){

    return parseDate(k).toLocaleDateString(
        "es-ES",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    );

}


function esc(s){

    return String(s ?? "")
        .replace(/[&<>"']/g,c=>({

            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#39;"

        }[c]));

}


/* =========================
   CONTADOR DE PALABRAS
========================= */

function countWords(text){

    return text
        .trim()
        .split(/\s+/)
        .filter(Boolean)
        .length;

}


function limitWords(text,max=100){

    const words =
        text.trim()
        .split(/\s+/)
        .filter(Boolean);

    return words.length <= max
        ? text
        : words.slice(0,max).join(" ");

}

/* =========================
   COMENTARIOS
========================= */

function updateMealComment(key,textarea){

    const original = textarea.value;

    const limited =
        limitWords(original,100);

    if(limited !== original){

        textarea.value = limited;

    }

    setField(
        key+"Note",
        textarea.value
    );

    const counter =
        document.getElementById(
            "counter-"+key
        );

    if(counter){

        const words =
            countWords(textarea.value);

        counter.textContent =
            `${words}/100 palabras`;

        counter.classList.toggle(
            "limit",
            words >= 100
        );

    }

}


/* =========================
   GUARDAR DÍA
========================= */

function saveDay(){

    const d = getDay(selectedDate);

    d.date = selectedDate;
    d.dow = parseDate(selectedDate).getDay();
    savePending = true;

    save();

    renderHistory();
    renderStats();

    const msg =
        document.getElementById(
            "saveMessage"
        );

    if(msg){

        msg.textContent =
            "✓ Día guardado correctamente";

        setTimeout(()=>{

            msg.textContent = "";

        },2500);

    }

}


/* =========================
   GUARDAR CAMPO
========================= */

function setField(k,v){

    const d = getDay(selectedDate);

    d[k] = v;
    savePending = true;

    save();

}


/* =========================
   CALCULAR SUEÑO
========================= */

function calcSleep(){

    const d = getDay(selectedDate);

    if(!d.bed || !d.wake){

        const el =
            document.getElementById("sleepValue");

        if(el){

            el.textContent = "—";

        }

        return;

    }


    let [bh,bm] =
        d.bed.split(":").map(Number);

    let [wh,wm] =
        d.wake.split(":").map(Number);


    let mins =
        (wh*60+wm) -
        (bh*60+bm);


    if(mins < 0){

        mins += 1440;

    }


    d.sleepHours =
        (mins/60).toFixed(1) + " h";
    savePending = true;


    save();


    const el =
        document.getElementById("sleepValue");

    if(el){

        el.textContent =
            d.sleepHours;

    }

}

function sleepFeedback(d){
    if(!d.bed || !d.wake){
        return `<div class="sleep-feedback">Objetivo recomendado: dormir 7 horas, aproximadamente de 00:00 a 07:00.</div>`;
    }

    let [bh,bm] = d.bed.split(":").map(Number);
    let [wh,wm] = d.wake.split(":").map(Number);
    let mins = (wh*60+wm) - (bh*60+bm);

    if(mins < 0) mins += 1440;

    const hours = (mins/60).toFixed(1);

    if(mins < 420){
        return `<div class="sleep-feedback warning">Has registrado ${hours} h. Intenta acercarte al objetivo de 7 horas.</div>`;
    }

    return `<div class="sleep-feedback">Objetivo cumplido: ${hours} h de sueño registrado.</div>`;
}


/* =========================
   PORCENTAJE
========================= */

function completion(d){

    const keys = [

        "breakfast",
        "lunch",
        "snack",
        "dinner",
        "creatine"

    ];


    const trainingDay =
        d.dow===1 ||
        d.dow===3;


    const total =
        keys.length +
        (trainingDay ? 2 : 0);


    let done =
        keys.filter(k=>d[k]).length;


    if(trainingDay){

        if(d.box) done++;

        if(d.weights) done++;

    }


    return Math.round(
        done / total * 100
    );

}


/* =========================
   CALENDARIO
========================= */

function changeCalendarMonth(amount){

    calendarDate.setMonth(
        calendarDate.getMonth()+amount
    );

    renderHistory();

}


function calendarDayClass(k){

    const d = data.days[k];

    if(!d){

        return "calendar-day";

    }

    const percent =
        completion(d);

    if(percent >= 80){

        return "calendar-day complete";

    }

    return "calendar-day partial";

}


function openCalendarDay(k){

    if(!data.days[k]){

        data.days[k] = blankDay(k);
        savePending = true;

        save();

    }

    selectedDate = k;

    switchTab("today");

    renderToday();

}


function renderHistory(){

    const year =
        calendarDate.getFullYear();

    const month =
        calendarDate.getMonth();


    const first =
        new Date(year,month,1);

    const last =
        new Date(year,month+1,0);


    const daysInMonth =
        last.getDate();


    /*
       JS: domingo = 0.
       Convertimos para que lunes sea 0.
    */

    let startDay =
        first.getDay() - 1;

    if(startDay < 0){

        startDay = 6;

    }


    const monthName =
        first.toLocaleDateString(
            "es-ES",
            {
                month:"long",
                year:"numeric"
            }
        );


    let cells = "";


    for(let i=0;i<startDay;i++){

        cells += `
            <div class="calendar-day empty"></div>
        `;

    }


    for(let day=1;day<=daysInMonth;day++){

        const k =
            `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;


        const todayClass =
            k===localDateKey()
            ? " today"
            : "";


        const selectedClass =
            k===selectedDate
            ? " selected"
            : "";


        cells += `

            <button
                class="${calendarDayClass(k)}${todayClass}${selectedClass}"
                onclick="openCalendarDay('${k}')"
                title="${formatDate(k)}"
            >
                ${day}
            </button>

        `;

    }

    /* Reservamos siempre 42 casillas: 6 filas de 7 días. */
    const totalCells = startDay + daysInMonth;

    for(let i=totalCells;i<42;i++){
        cells += `
            <div class="calendar-day empty"></div>
        `;
    }


    document.getElementById("history").innerHTML = `

    <div class="section">

        <div class="section-title">
            Historial
        </div>


        <div class="notice">

            El calendario muestra tus días registrados.
            Los días con más progreso aparecen en verde
            y los días parcialmente registrados en azul.

        </div>

    </div>


    <div class="section">

        <div class="card calendar-card">

            <div class="calendar-header">

                <div class="calendar-title">
                    ${esc(monthName)}
                </div>


                <div class="calendar-nav">

                    <button
                        onclick="changeCalendarMonth(-1)"
                        aria-label="Mes anterior"
                    >
                        ‹
                    </button>

                    <button
                        onclick="changeCalendarMonth(1)"
                        aria-label="Mes siguiente"
                    >
                        ›
                    </button>

                </div>

            </div>


            <div class="calendar-weekdays">

                <div>L</div>
                <div>M</div>
                <div>X</div>
                <div>J</div>
                <div>V</div>
                <div>S</div>
                <div>D</div>

            </div>


            <div class="calendar-grid">

                ${cells}

            </div>


            <div class="calendar-legend">

                <div class="legend-item">

                    <span class="legend-dot empty"></span>

                    Sin registrar

                </div>


                <div class="legend-item">

                    <span class="legend-dot partial"></span>

                    Registrado

                </div>


                <div class="legend-item">

                    <span class="legend-dot complete"></span>

                    Día completo

                </div>

            </div>


            <div class="history-selected">

                Pulsa cualquier día para abrirlo y editarlo.

            </div>

        </div>

    </div>

    `;

}


/* =========================
   EDITAR DÍA
========================= */

function editDay(k){

    selectedDate = k;

    switchTab("today");

    renderToday();

}


/* =========================
   ESTADÍSTICAS
========================= */

function recentDays(count=7){
    const result = [];
    const today = new Date();

    for(let i=count-1;i>=0;i--){
        const date = new Date(today);
        date.setHours(12,0,0,0);
        date.setDate(today.getDate()-i);
        const key = localDateKey(date);
        result.push(data.days[key] || blankDay(key));
    }

    return result;
}

function renderStats(){

    const keys =
        Object.keys(data.days)
        .sort();


    const days =
        keys.map(k=>data.days[k]);


    const avg =
        days.length
        ?
        Math.round(
            days.reduce(
                (s,d)=>s+completion(d),
                0
            ) / days.length
        )
        :
        0;


    const meals =
        days.length
        ?
        Math.round(
            days.reduce(
                (s,d)=>
                    s +
                    [
                        "breakfast",
                        "lunch",
                        "snack",
                        "dinner"
                    ]
                    .filter(x=>d[x]).length,
                0
            )
            /
            (days.length*4)
            *
            100
        )
        :
        0;


    const train =
        days.filter(
            d=>d.box || d.weights
        ).length;


    const creat =
        days.length
        ?
        Math.round(
            days.filter(
                d=>d.creatine
            ).length
            /
            days.length
            *
            100
        )
        :
        0;

    const weekly = recentDays(7);
    const weeklyBars = weekly.map(d=>{
        const percent = completion(d);
        const label = parseDate(d.date).toLocaleDateString("es-ES",{weekday:"short"}).replace(".","");
        return `
            <div class="bar-item" title="${esc(formatDate(d.date))}: ${percent}%">
                <span class="bar-value">${percent}%</span>
                <span class="bar-track"><i class="bar-fill" style="height:${percent}%"></i></span>
                <span class="bar-label">${esc(label)}</span>
            </div>
        `;
    }).join("");


    document.getElementById("stats").innerHTML = `

    <div class="section">

        <div class="section-title">
            Estadísticas
        </div>


        <div class="stats-grid">

            <div class="stat">

                <b>${days.length}</b>

                <span>
                    días registrados
                </span>

            </div>


            <div class="stat">

                <b>${avg}%</b>

                <span>
                    cumplimiento medio
                </span>

            </div>


            <div class="stat">

                <b>${meals}%</b>

                <span>
                    comidas registradas
                </span>

            </div>


            <div class="stat">

                <b>${train}</b>

                <span>
                    días con entrenamiento
                </span>

            </div>


            <div class="stat">

                <b>${creat}%</b>

                <span>
                    días con creatina
                </span>

            </div>


            <div class="stat">

                <b>
                    ${
                        days.filter(
                            d=>d.sleepHours
                        ).length
                    }
                </b>

                <span>
                    días con sueño registrado
                </span>

            </div>

        </div>

    </div>


    <div class="section">
        <div class="card chart-card">
            <div class="chart-title">Evolución de cumplimiento · últimos 7 días</div>
            <div class="bar-chart" role="img" aria-label="Gráfico de cumplimiento de los últimos siete días">
                ${weeklyBars}
            </div>
        </div>
    </div>

    <div class="section">

        <div class="section-title">
            Días registrados
        </div>


        <div class="card neon-card">

            ${
                days
                .slice()
                .reverse()
                .slice(0,14)
                .map(d=>`

                    <div style="
                        margin:12px 0;
                    ">

                        <div style="
                            display:flex;
                            justify-content:space-between;
                            font-size:13px;
                        ">

                            <span>
                                ${esc(shortDate(d.date))}
                            </span>


                            <span>
                                ${completion(d)}%
                            </span>

                        </div>


                        <div class="progress">

                            <i
                                style="
                                    width:${completion(d)}%;
                                "
                            ></i>

                        </div>

                    </div>

                `)
                .join("")

                ||

                `

                <div class="empty">
                    Sin datos todavía.
                </div>

                `

            }

        </div>

    </div>


    <div class="section">

        <button
            class="btn danger"
            onclick="clearAll()"
        >
            Borrar todos los registros
        </button>

    </div>

    `;

}


/* =========================
   BORRAR DATOS
========================= */

function clearAll(){

    if(
        confirm(
            "¿Seguro que quieres borrar todos los registros?"
        )
    ){

        data = {

            days:{},

            lastOpen:localDateKey()

        };

        savePending = true;


        save();


        selectedDate =
            localDateKey();


        calendarDate =
            new Date();


        renderAll();

    }

}


/* =========================
   CAMBIAR PESTAÑA
========================= */

function switchTab(tab){

    document
        .querySelectorAll(".tabs button")
        .forEach(b=>{

            b.classList.toggle(
                "active",
                b.dataset.tab===tab
            );

        });


    document
        .querySelectorAll(".view")
        .forEach(v=>{

            v.classList.toggle(
                "active",
                v.id===tab
            );

        });

}


/* =========================
   NAVEGACIÓN
========================= */

document
    .querySelectorAll(".tabs button")
    .forEach(b=>{

        b.onclick=()=>{

            switchTab(
                b.dataset.tab
            );

            if(b.dataset.tab === "today") renderToday();
            if(b.dataset.tab === "history") renderHistory();
            if(b.dataset.tab === "stats") renderStats();

        };

    });


/* =========================
   RENDERIZAR TODO
========================= */

function renderAll(){

    renderToday();

    renderHistory();

    renderStats();

}


/* =========================
   INICIAR
========================= */

function initializeApp(){
    autoRollover();
    selectedDate = localDateKey();
    calendarDate = new Date();
    switchTab("today");
    renderAll();
}

if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded",initializeApp,{once:true});
}else{
    initializeApp();
}

/* Refuerzo de guardado cada 2 segundos sin volver a renderizar la página. */
setInterval(save,2000);


/* =========================
   COMPROBAR CAMBIO DE DÍA
========================= */

setInterval(()=>{

    const now =
        localDateKey();


    if(data.lastOpen !== now){

        data.lastOpen = now;


        if(!data.days[now]){

            data.days[now] =
                blankDay(now);

        }


        save();


        selectedDate = now;

        calendarDate =
            new Date();


        renderAll();

    }

},15000);


/* =========================
   VOLVER A LA APP
========================= */

document.addEventListener(
    "visibilitychange",
    ()=>{

        if(!document.hidden){

            autoRollover();
            selectedDate = localDateKey();
            calendarDate = new Date();
            switchTab("today");
            renderToday();

            renderHistory();

            renderStats();

        }

    }
);

</script>
